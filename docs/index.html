<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calado Río de la Plata y Paraná</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#14202b;--mu:#5b6b7a;--bd:#d8e0e8;--a:#1f4e78;--b:#d9480f;--c:#2b8a3e;--w:#b08900}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#17212c;--tx:#e6edf3;--mu:#94a3b3;--bd:#2a3846;--a:#6cb2ee;--b:#ff8c5a;--c:#6fd07f;--w:#e3b341}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
header{padding:14px 16px 6px}h1{font-size:19px;margin:0}small,.mu{color:var(--mu)}
nav{display:flex;gap:6px;padding:8px 16px;overflow-x:auto}nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
nav button.on{background:var(--a);color:#fff;border-color:var(--a)}
main{padding:0 16px 40px;max-width:980px;margin:auto}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0}
select{padding:8px;font-size:15px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
.wrap{overflow-x:auto}.warn{background:#fff3cd;color:#664d03;padding:8px 12px;border-radius:8px;margin:8px 0}
.lg span{display:inline-block;margin-right:12px;font-size:13px}.lg i{display:inline-block;width:12px;height:3px;margin-right:4px;vertical-align:middle}
svg{width:100%;height:auto;display:block}footer{padding:10px 16px;font-size:12px;color:var(--mu);max-width:980px;margin:auto}
</style></head><body>
<header><h1>Calado · Río de la Plata y Paraná</h1><small id="gen">cargando…</small></header>
<nav id="nav"></nav><main id="m"></main>
<footer>Datos: SHN (alturas y pronósticos de marea), INA (Paraná y Delta), SMN (viento), CARP (históricos). Horas ART. Información de apoyo: <b>no es un dato oficial</b>; verificar siempre con la fuente. Modelo de Norden: preliminar.</footer>
<script>
const TABS=['Estuario','Paraná','Viento','Aciertos'];let S,R,tab=0,sel={};
const $=(s,e=document)=>e.querySelector(s);
const ART=t=>new Date(t+':00-03:00');                     // 'YYYY-MM-DDTHH:MM' ART
const fmt=d=>d.toLocaleString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const hh=d=>d.toLocaleTimeString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',hour12:false});
function chart(series,{w=560,h=300,unit='m',now=true}={}){
  const all=series.flatMap(s=>s.pts);if(!all.length)return'<p class="mu">Sin datos</p>';
  let x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0])),y0=Math.min(...all.map(p=>p[1])),y1=Math.max(...all.map(p=>p[1]));
  const pad=(y1-y0)*.1||.2;const pos=y0>=0;y0-=pad;y1+=pad;if(pos&&unit=='kn')y0=Math.max(0,y0);const L=50,B=28,T=8,Rr=8,X=t=>L+(t-x0)/(x1-x0||1)*(w-L-Rr),Y=v=>T+(1-(v-y0)/(y1-y0))*(h-T-B);
  let o=`<svg viewBox="0 0 ${w} ${h}">`;
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;o+=`<line x1="${L}" x2="${w-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="${L-5}" y="${Y(v)+4}" text-anchor="end" font-size="15" fill="var(--mu)">${v.toFixed(2)}</text>`}
  const d0=new Date(x0);d0.setMinutes(0,0,0);const st=(x1-x0)>6*864e5?864e5:(x1-x0)>2*864e5?6*36e5:3*36e5;
  for(let t=Math.ceil(x0/st)*st;t<=x1;t+=st){const d=new Date(t);o+=`<line x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${h-B}" stroke="var(--bd)" stroke-dasharray="2 3"/><text x="${X(t)}" y="${h-8}" text-anchor="middle" font-size="13" fill="var(--mu)">${st>=864e5?d.toLocaleDateString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',day:'2-digit',month:'2-digit'}):hh(d)}</text>`}
  if(now){const n=Date.now();if(n>x0&&n<x1)o+=`<line x1="${X(n)}" x2="${X(n)}" y1="${T}" y2="${h-B}" stroke="var(--w)" stroke-width="1.5"/>`}
  for(const s of series){if(s.dots){for(const p of s.pts)o+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4.5" fill="${s.c}"/>`;continue}
    o+=`<polyline fill="none" stroke="${s.c}" stroke-width="${s.sw||2}" ${s.dash?'stroke-dasharray="6 4"':''} points="${s.pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`}
  return o+'</svg><div class="lg">'+series.filter(s=>s.n).map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')+'</div>'}
function pick(id,opts,cb){return`<select id="${id}" onchange="sel['${id}']=this.value;render()">`+opts.map(o=>`<option ${sel[id]==o?'selected':''}>${o}</option>`).join('')+'</select>'}
const AGE=(iso)=>{const h=(Date.now()-new Date(iso))/36e5;return h}
function fresh(){let w='';const chk=[['SHN alturas',S.shn_obs_capturado],['SHN pronóstico',S.shn_pron&&S.shn_pron.capturado_utc],['INA',S.ina_capturado_utc],['SMN viento',S.viento&&S.viento.capturado_utc]];
  for(const[n,t]of chk){if(!t)continue;const h=AGE(t);if(h>30)w+=`<div class="warn">⚠ ${n}: último dato de hace ${Math.round(h)} h</div>`}return w}
const SHNKEY={'Oyarvide':'CANAL PUNTA INDIO','La Plata':'PUERTO LA PLATA','Buenos Aires':'PUERTO DE BUENOS AIRES','San Fernando':'SAN FERNANDO'};
const INAK={'San Fernando':'san_fernando','Buenos Aires':'buenos_aires','La Plata':'la_plata','Martín García':'martin_garcia'};
function estuario(){const names=Object.keys(S.shn_obs);sel.est=sel.est||'Buenos Aires';const n=sel.est;
  const so=(S.shn_obs[n]||[]).map(p=>[+ART(p[0]),p[1]]);const ser=[{n:'SHN observado',c:'var(--a)',pts:so}];
  const ev=(S.shn_pron&&SHNKEY[n])?S.shn_pron.eventos.filter(e=>e.lugar.includes(SHNKEY[n])):[];
  if(ev.length)ser.push({n:'SHN pronóstico (pleamar/bajamar)',c:'var(--b)',dots:1,pts:ev.map(e=>[+ART(e.t),e.h])});
  const ik=INAK[n],ip=ik&&S.ina[ik]&&S.ina[ik].pron.length>20?S.ina[ik].pron:null;
  if(ip)ser.push({n:'INA pronóstico',c:'var(--c)',dash:1,pts:ip.map(p=>[+ART(p[0]),p[1]])});
  let t='';if(ev.length)t=`<div class="wrap"><table><tr><th>Evento</th><th>Hora</th><th>Altura (m)</th></tr>`+ev.sort((a,b)=>a.t<b.t?-1:1).map(e=>`<tr><td>${e.estado.toLowerCase()}</td><td>${fmt(ART(e.t))}</td><td>${e.h.toFixed(2)}</td></tr>`).join('')+'</table></div><p class="mu">Boletín SHN válido desde '+S.shn_pron.valido_desde+' hasta '+S.shn_pron.valido_hasta+'.</p>';
  else t='<p class="mu">El SHN no publica pronóstico para esta estación (solo La Plata, Buenos Aires, San Fernando y Punta Indio).</p>';
  const last=so.length?so[so.length-1]:null;
  return`<div class="card">${pick('est',names)} ${last?`<b style="margin-left:10px">${last[1].toFixed(2)} m</b> <small>a las ${hh(new Date(last[0]))}</small>`:''}${chart(ser)}</div><div class="card">${t}</div>`}
const PAR=['campana','baradero','san_pedro','ramallo','san_nicolas','villa_constitucion','rosario','san_lorenzo_san_martin','diamante','santa_fe','parana_ciudad','goya','barranqueras','corrientes'];
const NM={campana:'Campana',baradero:'Baradero',san_pedro:'San Pedro',ramallo:'Ramallo',san_nicolas:'San Nicolás',villa_constitucion:'Villa Constitución',rosario:'Rosario',san_lorenzo_san_martin:'San Lorenzo',diamante:'Diamante',santa_fe:'Santa Fe',parana_ciudad:'Paraná',goya:'Goya',barranqueras:'Barranqueras',corrientes:'Corrientes'};
function parana(){const opts=PAR.filter(k=>S.ina[k]).map(k=>NM[k]);sel.par=sel.par||'Rosario';const k=PAR.find(x=>NM[x]==sel.par),e=S.ina[k];
  const ser=[{n:'INA observado',c:'var(--a)',pts:e.obs.map(p=>[+ART(p[0]),p[1]])},{n:'INA pronóstico (central)',c:'var(--c)',dash:1,pts:e.pron.map(p=>[+ART(p[0]),p[1]])},{n:'banda min/max',c:'var(--mu)',sw:1,pts:e.pron.map(p=>[+ART(p[0]),p[2]??p[1]])},{n:'',c:'var(--mu)',sw:1,pts:e.pron.map(p=>[+ART(p[0]),p[3]??p[1]])}].filter(s=>s.pts.length);
  const tb=e.pron.length?`<div class="wrap"><table><tr><th>Fecha</th><th>Central</th><th>Mín</th><th>Máx</th></tr>`+e.pron.slice(0,14).map(p=>`<tr><td>${fmt(ART(p[0]))}</td><td>${p[1]}</td><td>${p[2]??'-'}</td><td>${p[3]??'-'}</td></tr>`).join('')+`</table></div>`:'<p class="mu">Sin pronóstico INA</p>';
  return`<div class="card">${pick('par',opts)} <small class="mu">corrida INA: ${e.corrida||'-'}</small>${chart(ser)}</div><div class="card">${tb}</div>`}
function viento(){const V=S.viento;if(!V)return'<p>Sin datos de viento</p>';const names=Object.keys(V.estaciones);sel.vi=sel.vi||'Pilote Norden';const p=V.estaciones[sel.vi]||[];
  const pts=p.map(x=>[+new Date(x[0]),x[1]*3.6/1.852]);const card=d=>['N','NE','E','SE','S','SO','O','NO'][Math.round(d/45)%8];
  return`<div class="card">${pick('vi',names)} <small class="mu">ciclo SMN ${V.ciclo_init.slice(0,13)} UTC · nudos</small>${chart([{n:'viento 10 m (nudos)',c:'var(--a)',pts}],{unit:'kn'})}</div><div class="card wrap"><table><tr><th>Hora</th><th>Viento (nudos)</th><th>Dirección</th></tr>`+p.filter((_,i)=>i%3==0).slice(0,24).map(x=>`<tr><td>${fmt(new Date(x[0]))}</td><td>${(x[1]*3.6/1.852).toFixed(0)}</td><td>${card(x[2])} (${x[2]}°)</td></tr>`).join('')+'</table></div>'}
function aciertos(){if(!R)return'<p>Sin resumen todavía</p>';const rows=[];for(const[e,v]of Object.entries(R.por_estacion))for(const[s,d]of Object.entries(v))rows.push(`<tr><td>${e}</td><td>${s.toUpperCase()}</td><td>${d.n}</td><td>${d.mae_alt_m}</td><td>${d.sesgo_alt_m}</td><td>${d.mae_hora_min}</td></tr>`);
  return`<div class="card"><p>Error = real − pronóstico. Días acumulados: <b>${R.dias.length}</b> (${R.dias[0]} → ${R.dias.at(-1)}). Con pocos días los números son orientativos.</p><div class="wrap"><table><tr><th>Estación</th><th>Fuente</th><th>N</th><th>Error alt. (m)</th><th>Sesgo (m)</th><th>Error hora (min)</th></tr>${rows.join('')}</table></div></div>`}
function render(){$('#nav').innerHTML=TABS.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};render()">${t}</button>`).join('');
  $('#m').innerHTML=fresh()+[estuario,parana,viento,aciertos][tab]()}
(async()=>{try{S=await (await fetch('data/site.json?'+Date.now())).json();try{R=await (await fetch('data/resumen.json?'+Date.now())).json()}catch(e){}
  $('#gen').textContent='Actualizado '+fmt(new Date(S.generado_utc));render()}catch(e){$('#gen').textContent='No se pudieron cargar los datos'}})();
</script></body></html>
